<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>妊娠週数・分娩予定日計算</title>

    <link rel="stylesheet"
          href="style.css">
          <link rel="manifest" href="manifest.json">
          <link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#4778ff">
</head>


<body>

<main class="app">

    <!-- =================================================
         タイトル
    ================================================== -->

    <header>
        <h1>妊娠週数・分娩予定日計算</h1>
    </header>


    <!-- =================================================
         タブ
    ================================================== -->

    <nav class="tabs">

        <button class="tab-button active"
                data-tab="calculator">
            予定日計算
        </button>

        <button class="tab-button"
                data-tab="calendar">
            妊娠カレンダー
        </button>

    </nav>


    <!-- =================================================
         予定日計算
    ================================================== -->

    <section id="calculator"
             class="tab-content active">


        <!-- 計算方法 -->

        <div class="card">

            <h2>計算方法</h2>


            <label class="method-row">

                <input type="radio"
                       name="method"
                       value="lmp"
                       checked>

                <span>最終月経開始日</span>

            </label>


            <label class="method-row">

                <input type="radio"
                       name="method"
                       value="ovulation">

                <span>排卵日／受精日</span>

            </label>


            <label class="method-row">

                <input type="radio"
                       name="method"
                       value="embryo">

                <span>胚移植日</span>

            </label>


            <div id="embryo-options"
                 class="embryo-options">

                <label>

                    <input type="radio"
                           name="embryo-day"
                           value="3">

                    Day 3

                </label>


                <label>

                    <input type="radio"
                           name="embryo-day"
                           value="5"
                           checked>

                    Day 5

                </label>

            </div>


            <label class="method-row">

                <input type="radio"
                       name="method"
                       value="due">

                <span>分娩予定日</span>

            </label>

        </div>


        <!-- 日付入力 -->

        <div class="card date-card">

            <label id="date-label"
                   for="input-date">

                最終月経開始日

            </label>


            <input type="date"
                   id="input-date">

        </div>


        <!-- 計算結果 -->

        <div class="card result-card">

            <h2>計算結果</h2>


            <div class="result-row">

                <span>分娩予定日</span>

                <strong id="due-date-result">
                    ―
                </strong>

            </div>


            <div class="result-row">

                <span>本日の妊娠週数</span>

                <strong id="ga-result">
                    ―
                </strong>

            </div>

        </div>

    </section>


    <!-- =================================================
         妊娠カレンダー
    ================================================== -->

    <section id="calendar"
             class="tab-content">


        <!-- 予定日 -->

        <div class="calendar-due-box">

            <span>分娩予定日</span>

            <strong id="calendar-due-date">
                未設定
            </strong>

        </div>


        <!-- 月移動 -->

        <div class="calendar-navigation">

            <button id="previous-month"
                    class="navigation-button">

                ‹ 前月

            </button>


            <h2 id="calendar-month-title">
                ----年--月
            </h2>


            <button id="next-month"
                    class="navigation-button">

                翌月 ›

            </button>

        </div>


        <button id="today-button"
                class="today-button">

            今月

        </button>


        <!-- 月間カレンダー -->

        <div class="calendar-card">

            <!-- 曜日 -->

            <div class="weekday">
                月
            </div>

            <div class="weekday">
                火
            </div>

            <div class="weekday">
                水
            </div>

            <div class="weekday">
                木
            </div>

            <div class="weekday">
                金
            </div>

            <div class="weekday saturday">
                土
            </div>

            <div class="weekday sunday">
                日
            </div>


            <!-- JavaScriptで日付を入れる -->

            <div id="calendar-days"
                 class="calendar-days">
            </div>

        </div>


        <!-- 選択した日 -->

        <div class="selected-date-card">

            <div id="selected-date">
                日付をタップしてください
            </div>

            <strong id="selected-ga">
            </strong>

        </div>

    </section>

</main>

<footer class="app-footer">
    © 2026 T. Ikeda in Kagoshima
</footer>

<script src="app.js"></script>

<script>
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(() => {
                    console.log("Service Worker 登録成功");
                })
                .catch(error => {
                    console.log(
                        "Service Worker 登録失敗",
                        error
                    );
                });

        });

    }
</script>

</body>

</html>
